<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Tùy Chỉnh - GitHub Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        @font-face {
            font-family: 'MyCustomFont';
            src: url('zh-cn.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'MyCustomFontBold';
            src: url('zh-cn.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        .font-custom {
            font-family: 'MyCustomFont', 'Helvetica Neue', Arial, sans-serif;
        }

        .main-text {
            font-family: 'MyCustomFont', 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite;
            font-variant: small-caps;
            word-spacing: 10px;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.4);
            }
        }

        .font-samples {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .font-sample-item {
            margin: 10px 0;
            padding: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .font-sample-item:hover {
            background: #f0f0f0;
            border-radius: 5px;
        }

        .btn-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .btn-custom {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="font-samples">
        <h3>Chọn font(test):</h3>
        <div class="font-sample-item" onclick="changeFont('Arial')">
            Arial
        </div>
        <div class="font-sample-item" onclick="changeFont('Helvetica')">
            Helvetica
        </div>
        <div class="font-sample-item" onclick="changeFont('MyCustomFont')">
            Custom Font (TTF)
        </div>
        <div class="font-sample-item" onclick="changeFont('Georgia')">
            Georgia
        </div>
        <div class="font-sample-item" onclick="changeFont('Courier New')">
            Courier New
        </div>
    </div>

    <!-- Main content -->
    <div class="main-container">
        <div class="main-text" id="mainText">
            chào bạn:>
        </div>
    </div>

    <div class="btn-container">
        <a href="page2.html" class="btn-custom">
            Khám Phá Ngay
        </a>
    </div>

    <script>
        function changeFont(fontName) {
            document.getElementById('mainText').style.fontFamily = fontName;
            
            localStorage.setItem('selectedFont', fontName);
        }

        window.onload = function() {
            const savedFont = localStorage.getItem('selectedFont');
            if (savedFont) {
                document.getElementById('mainText').style.fontFamily = savedFont;
            }
        }
    </script>
</body>
</html>
